name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validator
        run: python validate.py

      # The validator checks that a scenario file names the skill it is for. This checks
      # the other direction: that the runner still parses, so the evals can be played
      # rather than only read.
      - name: Eval runner parses
        run: node --check skills/evals/run.js
